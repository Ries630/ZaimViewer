name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチで新しい push があれば古い実行は打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # anti-slop の Oxlint プラグインは .ts のまま読まれ、Oxlint は node で
      # 実行する。型ストリップは node 22.18 以降でしか既定で効かないため、
      # ランナー既定の node に任せると設定の読み込み自体が失敗しうる
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 依存関係のインストール
        run: bun install --frozen-lockfile

      - name: Worker の型定義を生成
        # worker-configuration.d.ts は生成物で追跡していないため、
        # 型検査の前に作る必要がある
        run: bun run cf-typegen

      - name: 整形・lint・型検査・テスト・ビルド
        # Zaim の認証情報も Cloudflare へのログインも要らない。テストは
        # ミラー DB と編集計画を workerd 上で検証し、Zaim API はスタブに置き換える。
        # PWA のビルドも通すのは、型が通ってもバンドルで落ちる形の壊れ方を
        # デプロイ前に捕まえるため
        run: bun run check
