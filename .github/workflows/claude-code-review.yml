name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# 同じ PR に続けて push したら古いレビューは打ち切る。synchronize は push の
# たびに飛ぶので、これが無いとレビューが積み上がってサブスクの枠を食う
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Claude GitHub App のトークンと交換する OIDC に要る。PR への書き込みは
      # そのアプリのトークンで行われるので、ここは read のままでよい
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # サブスク枠を使う。API クレジットは消費しない
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"

          # prompt を渡すと automation モードになり、@claude を待たずに起動する
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"

          # --allowedTools にツール名を書いたときだけ、Action がインラインコメント用の
          # MCP サーバーを起こす。スキル側の allowed-tools に同じ名前があっても、
          # ここに無ければサーバーが立たず指摘はログに出るだけで PR に載らない
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
