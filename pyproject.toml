[project]
name = "zaimviewer"
version = "0.1.0"
description = "Zaim の明細をローカル SQLite にミラーし、フィルタに強い閲覧 UI を提供する"
requires-python = ">=3.14"
dependencies = [
    "requests-oauthlib>=2.0",
    "python-dotenv>=1.1",
]

[project.scripts]
zaim-sync = "zaimviewer.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zaimviewer"]
