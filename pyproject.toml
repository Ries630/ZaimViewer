[project]
name = "zaimviewer"
version = "0.1.0"
description = "Zaim の明細をローカル SQLite にミラーし、フィルタに強い閲覧 UI を提供する"
requires-python = ">=3.14"
dependencies = [
    "requests-oauthlib>=2.0",
    "python-dotenv>=1.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
zaim-sync = "zaimviewer.sync:main"
zaim-api = "zaimviewer.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zaimviewer"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
